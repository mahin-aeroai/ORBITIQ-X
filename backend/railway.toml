[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements/base.txt"

[deploy]
startCommand = "bash entrypoint.sh gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "orbitiq-backend"
