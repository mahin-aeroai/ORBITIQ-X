# ============================================================
# ORBITIQ-X — Alembic configuration
# ============================================================
[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template used for new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for %%(year)d etc. in file_template
# timezone =

prepend_sys_path = .

# sys.path manipulation; useful for `alembic revision --autogenerate`
# version_path_separator = os  # Use os.pathsep

# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
