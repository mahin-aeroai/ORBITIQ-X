name: Database migrations CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/alembic/**"
      - "backend/app/db/**"
      - "backend/migrate.py"
  pull_request:
    branches: [main]
    paths:
      - "backend/alembic/**"
      - "backend/app/db/**"
      - "backend/migrate.py"

jobs:
  # ── Job 1: Validate migration chain ──────────────────────────
  validate-migrations:
    name: Validate migration chain
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitiq_test
          POSTGRES_USER: orbitiq
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbitiq -d orbitiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: orbitiq_test
      POSTGRES_USER: orbitiq
      POSTGRES_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install migration dependencies
        run: |
          cd backend
          pip install alembic sqlalchemy psycopg2-binary

      - name: Apply all migrations (upgrade head)
        run: |
          cd backend
          python migrate.py upgrade head

      - name: Verify schema matches models
        run: |
          cd backend
          python migrate.py verify

      - name: Test full rollback chain
        run: |
          cd backend
          # Roll back all migrations to confirm every downgrade() works
          python migrate.py downgrade base --force
          echo "Full rollback successful"

      - name: Re-apply after rollback test
        run: |
          cd backend
          python migrate.py upgrade head
          python migrate.py verify
          echo "Re-apply after rollback successful"

  # ── Job 2: Check no schema drift on PR ───────────────────────
  check-schema-drift:
    name: Check autogenerate finds no drift
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitiq_drift
          POSTGRES_USER: orbitiq
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbitiq -d orbitiq_drift"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: orbitiq_drift
      POSTGRES_USER: orbitiq
      POSTGRES_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install alembic sqlalchemy psycopg2-binary

      - name: Apply migrations
        run: cd backend && python migrate.py upgrade head

      - name: Check for uncommitted model changes
        run: |
          cd backend
          # alembic check returns non-zero if models and DB differ
          python -m alembic -c alembic.ini check
          echo "No schema drift detected"

  # ── Job 3: SQL preview artifact ──────────────────────────────
  generate-sql-artifact:
    name: Generate migration SQL artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install alembic
        run: pip install alembic sqlalchemy

      - name: Generate SQL (offline mode)
        run: |
          cd backend
          # Offline mode generates SQL without a DB connection
          python -m alembic -c alembic.ini upgrade head --sql > ../docs/migrations/latest_migrations.sql
          echo "SQL artifact generated"

      - name: Upload SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-sql-${{ github.sha }}
          path: docs/migrations/latest_migrations.sql
          retention-days: 30
