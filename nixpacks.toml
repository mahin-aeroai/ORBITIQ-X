[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "stdenv.cc.cc.lib", "zlib"]

[phases.install]
cmds = [
  "export LD_LIBRARY_PATH=$(find /nix/store -name 'libstdc++.so.6' 2>/dev/null | head -1 | xargs dirname):$LD_LIBRARY_PATH",
  "cd backend && pip install --break-system-packages --no-binary greenlet greenlet",
  "cd backend && pip install --break-system-packages -r requirements/base.txt"
]

[start]
cmd = "cd backend && export LD_LIBRARY_PATH=$(find /nix/store -name 'libstdc++.so.6' 2>/dev/null | head -1 | xargs dirname):$LD_LIBRARY_PATH && bash entrypoint.sh app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120"
