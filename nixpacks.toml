[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "stdenv.cc.cc.lib", "gcc"]

[phases.install]
cmds = ["cd backend && pip install --break-system-packages -r requirements/base.txt"]

[start]
cmd = "cd backend && bash entrypoint.sh app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120"
