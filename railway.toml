[build]
builder = "nixpacks"
buildCommand = "cd backend && pip install --break-system-packages -r requirements/base.txt"

[deploy]
startCommand = "cd backend && bash entrypoint.sh gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
