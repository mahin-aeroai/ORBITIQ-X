# =============================================================================
# ORBITIQ-X — Docker Compose Production Stack
# =============================================================================
# Production configuration with:
#   - Resource limits (CPU + memory) on all containers
#   - Restart policies (always)
#   - Named volumes with explicit driver options
#   - Startup ordering via depends_on with healthcheck conditions
#   - No port exposure to host (Nginx terminates TLS)
#   - Structured JSON logging
#
# Usage
# ──────
#   docker compose -f deployment/docker/docker-compose.prod.yml up -d
#   docker compose -f deployment/docker/docker-compose.prod.yml down
#
# Prerequisites
# ─────────────
#   .env file with all CHANGE_ME values replaced
#   SSL certificate at SSL_CERT_PATH / SSL_KEY_PATH
#   See docs/OPERATIONS/DEPLOYMENT.md for full checklist
# =============================================================================

name: orbitiq-x-prod

x-logging: &json-logging
  driver: "json-file"
  options:
    max-size:  "100m"
    max-file:  "5"
    tag:       "orbitiq/{{.Name}}"

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    container_name: orbitiq-postgres-prod
    environment:
      POSTGRES_DB:                    ${POSTGRES_DB}
      POSTGRES_USER:                  ${POSTGRES_USER}
      POSTGRES_PASSWORD:              ${POSTGRES_PASSWORD}
      PGDATA:                         /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS:           "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval:     10s
      timeout:      5s
      retries:      10
      start_period: 30s
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "2.0"
          memory: "2G"
        reservations:
          memory: "512M"
    logging: *json-logging

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    restart: always
    container_name: orbitiq-redis-prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test:         ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval:     10s
      timeout:      5s
      retries:      10
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "1G"
        reservations:
          memory: "256M"
    logging: *json-logging

  # ─── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.25-community
    restart: always
    container_name: orbitiq-neo4j-prod
    environment:
      NEO4J_AUTH:                                     ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS:                                  '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted:    "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist:       "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size:          1g
      NEO4J_server_memory_heap_max__size:              2g
      NEO4J_server_memory_pagecache_size:              1g
      # Disable HTTP browser in prod (Bolt only)
      NEO4J_server_bolt_enabled:                       "true"
      NEO4J_server_http_enabled:                       "false"
      NEO4J_server_https_enabled:                      "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_backup:/backups
    healthcheck:
      test:         ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval:     30s
      timeout:      10s
      retries:      10
      start_period: 90s
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "2.0"
          memory: "4G"
        reservations:
          memory: "2G"
    logging: *json-logging

  # ─── Weaviate ────────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.27.2
    restart: always
    container_name: orbitiq-weaviate-prod
    environment:
      QUERY_DEFAULTS_LIMIT:               25
      AUTHENTICATION_APIKEY_ENABLED:       "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS:  ${WEAVIATE_API_KEY}
      AUTHENTICATION_APIKEY_USERS:         admin
      AUTHORIZATION_ADMINLIST_ENABLED:     "true"
      AUTHORIZATION_ADMINLIST_USERS:       admin
      PERSISTENCE_DATA_PATH:               /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE:           text2vec-openai
      ENABLE_MODULES:                      "text2vec-openai,generative-openai"
      OPENAI_APIKEY:                       ${OPENAI_API_KEY}
      CLUSTER_HOSTNAME:                    orbitiq-weaviate
      LIMIT_RESOURCES:                     "true"
      GOMEMLIMIT:                          2GiB
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test:         ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval:     15s
      timeout:      5s
      retries:      10
      start_period: 60s
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "2.0"
          memory: "3G"
        reservations:
          memory: "1G"
    logging: *json-logging

  # ─── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: always
    container_name: orbitiq-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:       ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:   ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    healthcheck:
      test:         ["CMD", "mc", "ready", "local"]
      interval:     15s
      timeout:      5s
      retries:      5
      start_period: 30s
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "1G"
        reservations:
          memory: "256M"
    logging: *json-logging

  # ─── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context:    ../..
      dockerfile: deployment/docker/Dockerfile.backend
    restart: always
    container_name: orbitiq-backend-prod
    env_file:   ../../.env
    environment:
      ORBITIQ_ENV:      production
      BACKEND_RELOAD:   "false"
      BACKEND_WORKERS:  "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:     30s
      timeout:      10s
      retries:      5
      start_period: 60s
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "4.0"
          memory: "4G"
        reservations:
          cpus:   "1.0"
          memory: "1G"
    logging: *json-logging

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context:    ../..
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.orbitiq-x.dev}
    restart: always
    container_name: orbitiq-frontend-prod
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:         ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval:     30s
      timeout:      10s
      retries:      5
      start_period: 30s
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "2.0"
          memory: "1G"
        reservations:
          memory: "256M"
    logging: *json-logging

  # ─── Nginx (TLS termination + reverse proxy) ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    container_name: orbitiq-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/orbitiq.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH}:/etc/ssl/certs/orbitiq.crt:ro
      - ${SSL_KEY_PATH}:/etc/ssl/private/orbitiq.key:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "nginx", "-t"]
      interval:     30s
      timeout:      5s
      retries:      3
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "256M"
    logging: *json-logging

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: always
    container_name: orbitiq-prometheus-prod
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.listen-address=:9090
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: "2G"
    logging: *json-logging

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    restart: always
    container_name: orbitiq-grafana-prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD:     ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:          "false"
      GF_SERVER_ROOT_URL:              https://grafana.orbitiq-x.dev
      GF_SECURITY_COOKIE_SECURE:       "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - orbitiq-internal
    deploy:
      resources:
        limits:
          cpus:   "0.5"
          memory: "512M"
    logging: *json-logging

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: orbitiq_prod_pgdata
    driver: local
  redis_data:
    name: orbitiq_prod_redis_data
    driver: local
  neo4j_data:
    name: orbitiq_prod_neo4j_data
    driver: local
  neo4j_logs:
    name: orbitiq_prod_neo4j_logs
    driver: local
  neo4j_plugins:
    name: orbitiq_prod_neo4j_plugins
    driver: local
  neo4j_backup:
    name: orbitiq_prod_neo4j_backup
    driver: local
  weaviate_data:
    name: orbitiq_prod_weaviate_data
    driver: local
  minio_data:
    name: orbitiq_prod_minio_data
    driver: local
  prometheus_data:
    name: orbitiq_prod_prometheus_data
    driver: local
  grafana_data:
    name: orbitiq_prod_grafana_data
    driver: local
  nginx_cache:
    name: orbitiq_prod_nginx_cache
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  orbitiq-internal:
    name: orbitiq-x-prod-internal
    driver: bridge
    internal: false   # Nginx needs external access; services use internal routing
