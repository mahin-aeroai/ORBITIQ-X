# =============================================================================
# ORBITIQ-X — Nginx Production Reverse Proxy
# =============================================================================
# Nginx 1.25+ configuration for production TLS termination.
#
# Architecture
# ─────────────
#   Browser → Nginx (443/TLS) → Next.js Frontend (3000)
#                             → FastAPI Backend  (8000)
#
# Security features
# ──────────────────
#   TLS 1.2/1.3 only with strong ciphers
#   HTTP → HTTPS redirect
#   HSTS with preload
#   Rate limiting per IP
#   Real-IP forwarding from Cloudflare/load balancer
#   Request size limits
#   Security headers (mirrors FastAPI layer for defence in depth)
#
# Rate limits (adjust to match BACKEND_RATE_LIMIT_REQUESTS)
# ───────────────────────────────────────────────────────────
#   api_limit:    100 req/min per IP → burst 20
#   auth_limit:   10  req/min per IP → burst 5  (stricter for auth endpoints)
#   frontend:     no limit (static content served by CDN in prod)
# =============================================================================

# ── Rate limit zones ──────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=health_limit:1m rate=60r/m;

# ── Upstream definitions ──────────────────────────────────────────────────────
upstream orbitiq_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream orbitiq_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Allow ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name orbitiq-x.dev www.orbitiq-x.dev;   # Update for your domain

    # ── TLS ────────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/orbitiq.crt;
    ssl_certificate_key /etc/ssl/private/orbitiq.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;

    # ── Request limits ─────────────────────────────────────────────────────────
    client_max_body_size 50M;   # Allow large TLE uploads
    client_body_timeout  30s;
    client_header_timeout 10s;

    # ── Real IP from Cloudflare / upstream load balancer ──────────────────────
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # ── Health check (no rate limit — used by load balancers) ─────────────────
    location = /health {
        limit_req zone=health_limit burst=10 nodelay;
        proxy_pass http://orbitiq_backend;
        proxy_http_version 1.1;
        access_log off;
    }

    # ── Prometheus metrics (internal only) ────────────────────────────────────
    location = /metrics {
        # Restrict to internal network only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://orbitiq_backend;
    }

    # ── API auth endpoints — stricter rate limiting ────────────────────────────
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;

        proxy_pass         http://orbitiq_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API (FastAPI backend) ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass          http://orbitiq_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";

        # Timeouts for long-running endpoints (agent tasks, graph queries)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;
    }

    # ── SSE (Server-Sent Events — conjunction alerts stream) ──────────────────
    location /api/v1/ssa/alerts/stream {
        proxy_pass          http://orbitiq_backend;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        # SSE requires no buffering
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        chunked_transfer_encoding on;
    }

    # ── Frontend (Next.js) ─────────────────────────────────────────────────────
    location / {
        proxy_pass          http://orbitiq_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        # Cache Next.js static assets
        location ~* \.(js|css|woff2?|png|jpg|ico|svg)$ {
            proxy_pass http://orbitiq_frontend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Error pages ────────────────────────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"error":"Rate limit exceeded","retry_after":60}';
    }

    error_page 502 503 504 /5xx.json;
    location = /5xx.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","platform":"ORBITIQ-X"}';
    }
}
