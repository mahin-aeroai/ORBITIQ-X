global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: 'orbitiq-x'

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: 'orbitiq-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
