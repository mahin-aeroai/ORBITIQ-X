## ORBITIQ-X — Grafana Dashboard Provisioning
## ================================================
## Auto-provisioned on container start.
## Grafana reads this from /etc/grafana/provisioning/dashboards/

apiVersion: 1

providers:
  - name: ORBITIQ-X
    orgId: 1
    folder: ORBITIQ-X
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
